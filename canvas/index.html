<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas</title>
<script src="/static/js/theme.js"></script>
<style>
  :root {
    --bg-color: #f0f0f0;
    --text-color: #4a4a4a;
    --text-muted: #808080;
    --heading-color: #000000;
    --border-color: #d0d0d0;
    --code-bg: #e2e2e2;
    --node-fill: #d0d0d0;
    --node-stroke: #4a4a4a;
    --node-selected: #888888;
    --edge-color: #b0b0b0;
    --toolbar-bg: #e8e8e8;
    --toolbar-border: #d0d0d0;
    --btn-bg: #d8d8d8;
    --btn-hover: #c8c8c8;
    --btn-active: #b0b0b0;
    --danger: #8b4040;
    --danger-hover: #a04848;
  }
  [data-theme="dark"] {
    --bg-color: #1e1e1e;
    --text-color: #b0b0b0;
    --text-muted: #808080;
    --heading-color: #ffffff;
    --border-color: #3a3a3a;
    --code-bg: #2a2a2a;
    --node-fill: #3a3a3a;
    --node-stroke: #b0b0b0;
    --node-selected: #888888;
    --edge-color: #555555;
    --toolbar-bg: #252525;
    --toolbar-border: #3a3a3a;
    --btn-bg: #333333;
    --btn-hover: #3e3e3e;
    --btn-active: #4a4a4a;
    --danger: #a05050;
    --danger-hover: #b85858;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-color);
    color: var(--text-color);
    font-family: 'ET Book', Georgia, serif;
    overflow: hidden;
    transition: background 0.2s, color 0.2s;
    display: flex;
    height: 100vh;
  }

  /* Sidebar toolbar */
  .toolbar {
    width: 200px;
    min-width: 200px;
    background: var(--toolbar-bg);
    border-right: 1px solid var(--toolbar-border);
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 6px;
    z-index: 10;
    transition: background 0.2s, border-color 0.2s;
    user-select: none;
    overflow-y: auto;
  }

  .toolbar h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--heading-color);
    margin-bottom: 4px;
    letter-spacing: 0.02em;
  }

  .toolbar-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 4px;
  }

  .toolbar-section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .toolbar button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px 10px;
    background: var(--btn-bg);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    color: var(--text-color);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  .toolbar button:hover {
    background: var(--btn-hover);
  }

  .toolbar button:active {
    background: var(--btn-active);
  }

  .toolbar button.active {
    background: var(--btn-active);
    border-color: var(--node-stroke);
  }

  .toolbar button.danger {
    color: var(--danger);
    border-color: var(--danger);
  }

  .toolbar button.danger:hover {
    background: var(--danger-hover);
    color: #ffffff;
  }

  .toolbar button svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .toolbar .separator {
    height: 1px;
    background: var(--border-color);
    margin: 4px 0;
  }

  .toolbar .shortcut {
    font-size: 10px;
    color: var(--text-muted);
    margin-left: auto;
    font-family: 'Source Code Pro', monospace;
  }

  .toolbar .button-row {
    display: flex;
    gap: 6px;
  }

  .toolbar .button-row button {
    flex: 1;
    justify-content: center;
    padding: 8px;
  }

  /* Color picker in toolbar */
  .color-picker {
    display: none;
    gap: 6px;
    padding: 8px 0;
  }

  .color-picker.visible {
    display: flex;
  }

  .color-swatch {
    flex: 1;
    height: 28px;
    border-radius: 4px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
  }

  .color-swatch:hover {
    transform: scale(1.15);
  }

  .color-swatch.selected {
    border-color: var(--heading-color);
  }

  /* Canvas area */
  .canvas-area {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Node styles */
  .node-group { cursor: grab; }
  .node-group:active { cursor: grabbing; }

  .node-rect {
    rx: 4;
    ry: 4;
    stroke-width: 2;
    transition: stroke 0.15s;
  }

  .node-rect.selected {
    stroke-dasharray: 4 2;
  }

  .node-text {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'ET Book', Georgia, serif;
    font-size: 14px;
    line-height: 1.2;
    text-align: center;
    padding: 4px 8px;
    color: var(--heading-color);
    pointer-events: none;
    user-select: none;
    overflow: hidden;
    word-wrap: break-word;
    hyphens: auto;
  }

  /* Edge styles */
  .edge-path {
    fill: none;
    stroke-width: 2;
    pointer-events: stroke;
    cursor: pointer;
    transition: stroke 0.15s;
  }

  .edge-path:hover {
    stroke-width: 3;
  }

  .edge-path.selected {
    stroke-dasharray: 6 3;
    stroke-width: 3;
  }

  /* Snap guide lines */
  .snap-guide {
    stroke: var(--node-selected);
    stroke-width: 1;
    stroke-dasharray: 4 3;
    pointer-events: none;
    opacity: 0.6;
  }

  /* Connection preview line */
  .connection-preview {
    fill: none;
    stroke: var(--node-selected);
    stroke-width: 2;
    stroke-dasharray: 5 5;
    pointer-events: none;
  }

  /* Selection box (rubber-band) */
  .selection-box {
    fill: var(--node-selected);
    fill-opacity: 0.12;
    stroke: var(--node-selected);
    stroke-width: 1;
    stroke-dasharray: 4 3;
    pointer-events: none;
  }

  /* Text editing */
  .node-edit-input {
    position: absolute;
    background: var(--code-bg);
    border: 1px solid var(--border-color);
    border-radius: 3px;
    color: var(--heading-color);
    font-family: 'ET Book', Georgia, serif;
    font-size: 14px;
    padding: 4px 8px;
    text-align: center;
    outline: none;
    z-index: 20;
  }

  /* Status bar */
  .status-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 28px;
    background: var(--toolbar-bg);
    border-top: 1px solid var(--toolbar-border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 11px;
    color: var(--text-muted);
    gap: 16px;
    transition: background 0.2s, border-color 0.2s;
  }

  /* ET Book font face */
  @font-face {
    font-family: 'ET Book';
    src: url('/static/css/et-book/et-book-roman-line-figures/et-book-roman-line-figures.woff') format('woff');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'ET Book';
    src: url('/static/css/et-book/et-book-bold-line-figures/et-book-bold-line-figures.woff') format('woff');
    font-weight: bold;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'Source Code Pro';
    src: local('Source Code Pro');
    font-display: swap;
  }

  /* Theme toggle button (created by theme.js) */
  .theme-toggle {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 20;
    background: var(--btn-bg);
    border: 1px solid var(--border-color);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-color);
    transition: background 0.15s;
    padding: 0;
  }
  .theme-toggle:hover { background: var(--btn-hover); }
  .theme-toggle svg { width: 18px; height: 18px; }
  [data-theme="dark"] .theme-toggle .sun { display: none; }
  [data-theme="dark"] .theme-toggle .moon { display: inline; }
  :root .theme-toggle .moon { display: none; }
  :root .theme-toggle .sun { display: inline; }

  /* Toast notification */
  .toast {
    position: fixed;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--code-bg);
    border: 1px solid var(--border-color);
    color: var(--text-color);
    padding: 8px 16px;
    border-radius: 4px;
    font-family: 'ET Book', Georgia, serif;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 30;
    pointer-events: none;
  }
  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 40;
  }
  .modal-overlay.visible { display: flex; }

  .modal {
    background: var(--toolbar-bg);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 22px 26px 18px;
    min-width: 320px;
    max-width: 420px;
    font-family: 'ET Book', Georgia, serif;
    color: var(--text-color);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
  }

  .modal-message {
    font-size: 16px;
    line-height: 1.4;
    color: var(--heading-color);
    margin-bottom: 22px;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .modal-actions button {
    padding: 8px 16px;
    background: var(--btn-bg);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    color: var(--text-color);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .modal-actions button:hover { background: var(--btn-hover); }
  .modal-actions button.danger {
    color: var(--danger);
    border-color: var(--danger);
  }
  .modal-actions button.danger:hover {
    background: var(--danger-hover);
    color: #ffffff;
  }
</style>
</head>
<body>

<div class="toolbar">
  <h2>Canvas</h2>

  <div class="toolbar-section">
    <div class="toolbar-section-label">Create</div>
    <button id="btn-add-node" title="Click on canvas to place a node">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="2" y="2" width="12" height="12" rx="2"/>
        <line x1="8" y1="5" x2="8" y2="11"/>
        <line x1="5" y1="8" x2="11" y2="8"/>
      </svg>
      Add node
      <span class="shortcut">N</span>
    </button>
    <button id="btn-add-edge" title="Drag from one node to another">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="3" cy="13" r="2"/>
        <circle cx="13" cy="3" r="2"/>
        <path d="M4.5 11.5 Q8 8 11.5 4.5"/>
      </svg>
      Add edge
      <span class="shortcut">E</span>
    </button>
  </div>

  <div class="separator"></div>

  <div class="toolbar-section">
    <div class="toolbar-section-label">View</div>
    <button id="btn-zoom-in">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="7" cy="7" r="5"/>
        <line x1="11" y1="11" x2="14" y2="14"/>
        <line x1="5" y1="7" x2="9" y2="7"/>
        <line x1="7" y1="5" x2="7" y2="9"/>
      </svg>
      Zoom in
      <span class="shortcut">+</span>
    </button>
    <button id="btn-zoom-out">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="7" cy="7" r="5"/>
        <line x1="11" y1="11" x2="14" y2="14"/>
        <line x1="5" y1="7" x2="9" y2="7"/>
      </svg>
      Zoom out
      <span class="shortcut">&minus;</span>
    </button>
    <button id="btn-zoom-reset">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="1" y="1" width="14" height="14" rx="2"/>
        <rect x="4" y="4" width="8" height="8" rx="1" stroke-dasharray="2 1"/>
      </svg>
      Fit to view
      <span class="shortcut">0</span>
    </button>
  </div>

  <div class="separator"></div>

  <div class="toolbar-section">
    <div class="toolbar-section-label">Selection</div>
    <button id="btn-color" disabled>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="8" cy="8" r="6"/>
        <circle cx="8" cy="8" r="3" fill="currentColor" opacity="0.3"/>
      </svg>
      Color
      <span class="shortcut">C</span>
    </button>
    <div class="color-picker" id="color-picker"></div>
    <button id="btn-distribute-h" disabled>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="1" y="4" width="3" height="8" rx="0.5"/>
        <rect x="6.5" y="4" width="3" height="8" rx="0.5"/>
        <rect x="12" y="4" width="3" height="8" rx="0.5"/>
      </svg>
      Distribute H
      <span class="shortcut">H</span>
    </button>
    <button id="btn-distribute-v" disabled>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="4" y="1" width="8" height="3" rx="0.5"/>
        <rect x="4" y="6.5" width="8" height="3" rx="0.5"/>
        <rect x="4" y="12" width="8" height="3" rx="0.5"/>
      </svg>
      Distribute V
      <span class="shortcut">V</span>
    </button>
    <button id="btn-delete" disabled>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <line x1="4" y1="4" x2="12" y2="12"/>
        <line x1="12" y1="4" x2="4" y2="12"/>
      </svg>
      Delete
      <span class="shortcut">Del</span>
    </button>
  </div>

  <div style="flex:1"></div>

  <div class="button-row">
    <button id="btn-clear" title="Clear all">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M3 4h10M6 4V3h4v1M5 4v9h6V4"/>
      </svg>
    </button>
    <button id="btn-undo" title="Undo (⌘Z)" disabled>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M3 7h7a3 3 0 0 1 0 6H6"/>
        <path d="M5.5 4.5 3 7l2.5 2.5"/>
      </svg>
    </button>
    <button id="btn-redo" title="Redo (⌘⇧Z)" disabled>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M13 7H6a3 3 0 0 0 0 6h4"/>
        <path d="M10.5 4.5 13 7l-2.5 2.5"/>
      </svg>
    </button>
    <button id="btn-share" title="Copy share link">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="4" cy="8" r="2"/>
        <circle cx="12" cy="4" r="2"/>
        <circle cx="12" cy="12" r="2"/>
        <path d="M5.7 7 10.3 4.7M5.7 9 10.3 11.3"/>
      </svg>
    </button>
  </div>
</div>

<div class="canvas-area">
  <svg id="canvas-svg"></svg>
  <div class="status-bar">
    <span id="status-mode">Select</span>
    <span id="status-info"></span>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-message" id="modal-message"></div>
    <div class="modal-actions">
      <button id="modal-cancel">Cancel</button>
      <button id="modal-confirm" class="danger">Clear all</button>
    </div>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(function() {
  'use strict';

  // ── State ──────────────────────────────────────────────────────
  const STORAGE_KEY = 'canvas-graph-state';
  const NODE_W = 160, NODE_H = 80;
  const COLORS = [
    { light: '#d0d0d0', dark: '#3a3a3a', label: 'Default' },
    { light: '#b8b8b8', dark: '#505050', label: 'Gray' },
    { light: '#c4b8a8', dark: '#4a4038', label: 'Warm' },
    { light: '#a8b8c4', dark: '#384450', label: 'Cool' },
    { light: '#b8c4b0', dark: '#3e4a38', label: 'Sage' },
  ];

  let nodes = [];
  let edges = [];
  let nextNodeId = 1;
  let nextEdgeId = 1;
  let selectedNodeIds = new Set();
  let selectedEdge = null;
  let mode = 'select'; // 'select' | 'add-node' | 'add-edge'
  let connectSource = null;
  let loadedFromHash = false;
  let clipboard = null;
  const SNAP_THRESHOLD = 8;
  let history = [];
  let future = [];
  const HISTORY_LIMIT = 50;
  let dragHistorySnapshot = null;
  let spaceDown = false;
  let selectBox = null;
  let suppressNextClick = false;

  // ── D3 Setup ───────────────────────────────────────────────────
  const svg = d3.select('#canvas-svg');
  const g = svg.append('g');

  // Layers
  const edgeLayer = g.append('g').attr('class', 'edge-layer');
  const nodeLayer = g.append('g').attr('class', 'node-layer');

  // Connection preview line
  const previewLine = g.append('path')
    .attr('class', 'connection-preview')
    .style('display', 'none');

  // Snap guide lines
  const snapLayer = g.append('g').attr('class', 'snap-layer');

  // Zoom
  const zoom = d3.zoom()
    .scaleExtent([0.1, 5])
    .on('zoom', (event) => g.attr('transform', event.transform));

  zoom.filter((event) => {
    // Wheel and touch events: default behavior (zoom/pinch)
    if (event.type !== 'mousedown') return !event.ctrlKey && !event.button;
    // Mouse drag pans only when space is held or middle-click
    return spaceDown || event.button === 1;
  });

  svg.call(zoom);

  // ── Helpers ────────────────────────────────────────────────────
  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function isDark() {
    return document.documentElement.getAttribute('data-theme') === 'dark';
  }

  function nodeColor(node) {
    const c = COLORS[node.colorIndex || 0];
    return isDark() ? c.dark : c.light;
  }

  function isSelected(node) {
    return selectedNodeIds.has(node.id);
  }

  function getSelectedNodes() {
    return nodes.filter(n => selectedNodeIds.has(n.id));
  }

  function save() {
    const state = { nodes, edges, nextNodeId, nextEdgeId };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }

  function load() {
    // Hash fragment takes priority (shared link)
    if (loadFromHash()) { loadedFromHash = true; return; }
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const state = JSON.parse(raw);
      nodes = state.nodes || [];
      edges = state.edges || [];
      nextNodeId = state.nextNodeId || 1;
      nextEdgeId = state.nextEdgeId || 1;
    } catch(e) {}
  }

  function encodeState() {
    const state = { n: [], e: [] };
    nodes.forEach(nd => {
      const entry = [nd.id, Math.round(nd.x), Math.round(nd.y), nd.label];
      if (nd.colorIndex) entry.push(nd.colorIndex);
      state.n.push(entry);
    });
    edges.forEach(ed => {
      state.e.push([ed.source, ed.target]);
    });
    return btoa(encodeURIComponent(JSON.stringify(state)));
  }

  function loadFromHash() {
    const hash = window.location.hash.slice(1);
    if (!hash) return false;
    try {
      const state = JSON.parse(decodeURIComponent(atob(hash)));
      if (!state.n) return false;
      nodes = state.n.map(a => ({
        id: a[0], x: a[1], y: a[2], label: a[3], colorIndex: a[4] || 0
      }));
      edges = (state.e || []).map((a, i) => ({
        id: i + 1, source: a[0], target: a[1]
      }));
      nextNodeId = Math.max(0, ...nodes.map(n => n.id)) + 1;
      nextEdgeId = edges.length + 1;
      window.history.replaceState(null, '', window.location.pathname);
      return true;
    } catch(e) { return false; }
  }

  function snapshot() {
    return {
      nodes: nodes.map(n => ({ ...n })),
      edges: edges.map(e => ({ ...e })),
      nextNodeId,
      nextEdgeId,
    };
  }

  function restoreSnapshot(snap) {
    nodes = snap.nodes.map(n => ({ ...n }));
    edges = snap.edges.map(e => ({ ...e }));
    nextNodeId = snap.nextNodeId;
    nextEdgeId = snap.nextEdgeId;
  }

  function pushHistory() {
    history.push(snapshot());
    if (history.length > HISTORY_LIMIT) history.shift();
    future = [];
    updateHistoryButtons();
  }

  function undo() {
    if (history.length === 0) return;
    future.push(snapshot());
    restoreSnapshot(history.pop());
    selectedNodeIds.clear();
    selectedEdge = null;
    updateSelectionButtons();
    updateHistoryButtons();
    render();
    save();
  }

  function redo() {
    if (future.length === 0) return;
    history.push(snapshot());
    restoreSnapshot(future.pop());
    selectedNodeIds.clear();
    selectedEdge = null;
    updateSelectionButtons();
    updateHistoryButtons();
    render();
    save();
  }

  function updateHistoryButtons() {
    document.getElementById('btn-undo').disabled = history.length === 0;
    document.getElementById('btn-redo').disabled = future.length === 0;
  }

  function showConfirm(message, confirmLabel, onConfirm) {
    const overlay = document.getElementById('modal-overlay');
    const confirmBtn = document.getElementById('modal-confirm');
    const cancelBtn = document.getElementById('modal-cancel');
    document.getElementById('modal-message').textContent = message;
    confirmBtn.textContent = confirmLabel;
    overlay.classList.add('visible');

    function close() {
      overlay.classList.remove('visible');
      confirmBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', close);
      overlay.removeEventListener('click', onBackdrop);
      document.removeEventListener('keydown', onKey, true);
    }
    function onOk() { close(); onConfirm(); }
    function onBackdrop(e) { if (e.target === overlay) close(); }
    function onKey(e) {
      if (e.key === 'Escape') { e.stopPropagation(); close(); }
      else if (e.key === 'Enter') { e.stopPropagation(); onOk(); }
    }

    confirmBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', close);
    overlay.addEventListener('click', onBackdrop);
    document.addEventListener('keydown', onKey, true);
    confirmBtn.focus();
  }

  function isModalOpen() {
    return document.getElementById('modal-overlay').classList.contains('visible');
  }

  function showToast(msg) {
    let toast = document.querySelector('.toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.className = 'toast';
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.classList.add('visible');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('visible'), 2000);
  }

  // ── Rendering ──────────────────────────────────────────────────
  function render() {
    renderEdges();
    renderNodes();
    updateStatusBar();
  }

  function renderNodes() {
    const groups = nodeLayer.selectAll('.node-group')
      .data(nodes, d => d.id);

    groups.exit().remove();

    const enter = groups.enter()
      .append('g')
      .attr('class', 'node-group')
      .attr('transform', d => `translate(${d.x},${d.y})`);

    enter.append('rect')
      .attr('class', 'node-rect')
      .attr('x', -NODE_W / 2)
      .attr('y', -NODE_H / 2)
      .attr('width', NODE_W)
      .attr('height', NODE_H);

    enter.append('foreignObject')
      .attr('class', 'node-fo')
      .attr('x', -NODE_W / 2)
      .attr('y', -NODE_H / 2)
      .attr('width', NODE_W)
      .attr('height', NODE_H)
      .style('pointer-events', 'none')
      .append('xhtml:div')
      .attr('class', 'node-text');

    // Drag
    enter.call(d3.drag()
      .on('start', onNodeDragStart)
      .on('drag', onNodeDrag)
      .on('end', onNodeDragEnd)
    );

    // Click
    enter.on('click', onNodeClick);
    enter.on('dblclick', (event, d) => {
      event.stopPropagation();
      startEditLabel(d);
    });

    // Update all (enter + existing)
    const all = nodeLayer.selectAll('.node-group')
      .data(nodes, d => d.id);

    all.attr('transform', d => `translate(${d.x},${d.y})`);

    all.select('.node-rect')
      .attr('fill', d => nodeColor(d))
      .attr('stroke', d => isSelected(d) ? cssVar('--node-selected') : cssVar('--node-stroke'))
      .classed('selected', d => isSelected(d));

    all.select('.node-text')
      .text(d => d.label);
  }

  function renderEdges() {
    const paths = edgeLayer.selectAll('.edge-path')
      .data(edges, d => d.id);

    paths.exit().remove();

    const enter = paths.enter()
      .append('path')
      .attr('class', 'edge-path')
      .on('click', onEdgeClick);

    const all = edgeLayer.selectAll('.edge-path')
      .data(edges, d => d.id);

    all.attr('d', d => {
        const s = nodes.find(n => n.id === d.source);
        const t = nodes.find(n => n.id === d.target);
        if (!s || !t) return '';
        return `M${s.x},${s.y} L${t.x},${t.y}`;
      })
      .attr('stroke', d => d === selectedEdge ? cssVar('--node-selected') : cssVar('--edge-color'))
      .classed('selected', d => d === selectedEdge);
  }

  // ── Interaction ────────────────────────────────────────────────
  function setMode(newMode) {
    mode = newMode;
    document.getElementById('btn-add-node').classList.toggle('active', mode === 'add-node');
    document.getElementById('btn-add-edge').classList.toggle('active', mode === 'add-edge');
    svg.style('cursor',
      mode === 'add-node' ? 'crosshair' :
      mode === 'add-edge' ? 'crosshair' : 'default'
    );
    if (mode !== 'add-edge') {
      connectSource = null;
      previewLine.style('display', 'none');
    }
    updateStatusBar();
  }

  function clearSelection() {
    selectedNodeIds.clear();
    selectedEdge = null;
    updateSelectionButtons();
    render();
  }

  function selectOnly(node) {
    selectedNodeIds.clear();
    selectedNodeIds.add(node.id);
    selectedEdge = null;
    updateSelectionButtons();
    render();
  }

  function toggleSelect(node) {
    if (selectedNodeIds.has(node.id)) {
      selectedNodeIds.delete(node.id);
    } else {
      selectedNodeIds.add(node.id);
    }
    selectedEdge = null;
    updateSelectionButtons();
    render();
  }

  function selectAllNodes() {
    nodes.forEach(n => selectedNodeIds.add(n.id));
    selectedEdge = null;
    updateSelectionButtons();
    render();
  }

  function selectEdge(edge) {
    selectedEdge = edge;
    selectedNodeIds.clear();
    updateSelectionButtons();
    render();
  }

  function updateSelectionButtons() {
    const selCount = selectedNodeIds.size;
    const hasAnySel = selCount > 0 || !!selectedEdge;
    document.getElementById('btn-color').disabled = selCount === 0;
    document.getElementById('btn-delete').disabled = !hasAnySel;
    document.getElementById('btn-distribute-h').disabled = selCount < 3;
    document.getElementById('btn-distribute-v').disabled = selCount < 3;
    if (selCount === 0) {
      document.getElementById('color-picker').classList.remove('visible');
    }
  }

  function updateStatusBar() {
    const modeLabel = {
      'select': 'Select',
      'add-node': 'Add node (click canvas)',
      'add-edge': connectSource ? 'Click target node' : 'Click source node',
    };
    let statusMode = modeLabel[mode] || 'Select';
    if (selectedNodeIds.size > 1) {
      statusMode += ` (${selectedNodeIds.size} selected)`;
    }
    document.getElementById('status-mode').textContent = statusMode;
    document.getElementById('status-info').textContent =
      `${nodes.length} node${nodes.length !== 1 ? 's' : ''}, ${edges.length} edge${edges.length !== 1 ? 's' : ''}`;
  }

  // ── Node interaction ───────────────────────────────────────────
  let dragMoved = false;
  let dragStartPositions = null;
  let selectionChangedInDragStart = false;

  function onNodeDragStart(event, d) {
    dragMoved = false;
    selectionChangedInDragStart = false;
    if (mode === 'add-edge') return;
    event.sourceEvent.stopPropagation();

    dragHistorySnapshot = snapshot();

    // If dragging an unselected node without shift, select only it
    if (!isSelected(d) && !event.sourceEvent.shiftKey) {
      selectedNodeIds.clear();
      selectedNodeIds.add(d.id);
      selectedEdge = null;
      selectionChangedInDragStart = true;
      updateSelectionButtons();
      render();
    }

    // Store start positions of all selected nodes for group drag
    dragStartPositions = new Map();
    getSelectedNodes().forEach(n => {
      dragStartPositions.set(n.id, { x: n.x, y: n.y });
    });
  }

  function onNodeDrag(event, d) {
    if (mode === 'add-edge') return;
    dragMoved = true;

    let x = event.x, y = event.y;
    const guides = [];

    // Snap the dragged node to non-selected nodes
    nodes.forEach(n => {
      if (selectedNodeIds.has(n.id)) return;
      if (Math.abs(x - n.x) < SNAP_THRESHOLD) {
        x = n.x;
        guides.push({ x1: n.x, y1: n.y, x2: n.x, y2: y });
      }
      if (Math.abs(y - n.y) < SNAP_THRESHOLD) {
        y = n.y;
        guides.push({ x1: n.x, y1: n.y, x2: x, y2: n.y });
      }
    });

    // Calculate delta from this node's start position
    const start = dragStartPositions.get(d.id);
    const dx = x - start.x;
    const dy = y - start.y;

    // Move all selected nodes by the same delta
    getSelectedNodes().forEach(n => {
      const s = dragStartPositions.get(n.id);
      n.x = s.x + dx;
      n.y = s.y + dy;
    });

    renderSnapGuides(guides);
    render();
  }

  function onNodeDragEnd(event, d) {
    if (mode === 'add-edge') return;
    snapLayer.selectAll('*').remove();
    dragStartPositions = null;
    if (dragMoved && dragHistorySnapshot) {
      history.push(dragHistorySnapshot);
      if (history.length > HISTORY_LIMIT) history.shift();
      future = [];
      updateHistoryButtons();
      save();
    }
    dragHistorySnapshot = null;
  }

  function renderSnapGuides(guides) {
    const lines = snapLayer.selectAll('.snap-guide').data(guides);
    lines.exit().remove();
    lines.enter().append('line').attr('class', 'snap-guide')
      .merge(lines)
      .attr('x1', d => d.x1).attr('y1', d => d.y1)
      .attr('x2', d => d.x2).attr('y2', d => d.y2);
  }

  function onNodeClick(event, d) {
    event.stopPropagation();

    if (mode === 'add-edge') {
      if (!connectSource) {
        connectSource = d;
        selectOnly(d);
        updateStatusBar();
      } else if (connectSource.id !== d.id) {
        const exists = edges.some(e =>
          (e.source === connectSource.id && e.target === d.id) ||
          (e.source === d.id && e.target === connectSource.id)
        );
        if (!exists) {
          pushHistory();
          edges.push({
            id: nextEdgeId++,
            source: connectSource.id,
            target: d.id,
          });
          save();
        }
        connectSource = null;
        previewLine.style('display', 'none');
        clearSelection();
        setMode('select');
      }
      return;
    }

    if (dragMoved || selectionChangedInDragStart) return;

    if (event.shiftKey || event.metaKey) {
      toggleSelect(d);
    } else {
      if (isSelected(d) && selectedNodeIds.size === 1) {
        clearSelection();
      } else {
        selectOnly(d);
      }
    }
  }

  function onEdgeClick(event, d) {
    event.stopPropagation();
    if (mode !== 'select') return;
    if (selectedEdge === d) {
      clearSelection();
    } else {
      selectEdge(d);
    }
  }

  // ── Rubber-band selection ──────────────────────────────────────
  document.getElementById('canvas-svg').addEventListener('mousedown', function(event) {
    if (mode !== 'select') return;
    if (spaceDown) return;
    if (event.button !== 0) return;
    if (event.target.closest('.node-group') || event.target.closest('.edge-path')) return;

    const [x0, y0] = d3.pointer(event, g.node());
    selectBox = { x0, y0, x1: x0, y1: y0, rect: null, moved: false, shiftKey: event.shiftKey };
    const baseSelection = event.shiftKey ? new Set(selectedNodeIds) : new Set();

    function onMove(e) {
      const [x, y] = d3.pointer(e, g.node());
      selectBox.x1 = x;
      selectBox.y1 = y;
      if (!selectBox.moved && (Math.abs(x - selectBox.x0) > 2 || Math.abs(y - selectBox.y0) > 2)) {
        selectBox.moved = true;
      }
      if (!selectBox.moved) return;
      const minX = Math.min(selectBox.x0, x);
      const minY = Math.min(selectBox.y0, y);
      const w = Math.abs(x - selectBox.x0);
      const h = Math.abs(y - selectBox.y0);
      if (!selectBox.rect) {
        selectBox.rect = g.append('rect').attr('class', 'selection-box');
      }
      selectBox.rect
        .attr('x', minX).attr('y', minY)
        .attr('width', w).attr('height', h);

      // Live-update selection as the box grows
      const hits = nodes.filter(n =>
        n.x + NODE_W / 2 >= minX && n.x - NODE_W / 2 <= minX + w &&
        n.y + NODE_H / 2 >= minY && n.y - NODE_H / 2 <= minY + h
      );
      selectedNodeIds = new Set(baseSelection);
      hits.forEach(n => selectedNodeIds.add(n.id));
      selectedEdge = null;
      updateSelectionButtons();
      render();
    }

    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      if (selectBox && selectBox.rect) {
        selectBox.rect.remove();
        suppressNextClick = true;
      }
      selectBox = null;
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // ── Space to pan ───────────────────────────────────────────────
  document.addEventListener('keydown', function(e) {
    if (e.code !== 'Space') return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (isModalOpen()) return;
    if (!spaceDown) {
      spaceDown = true;
      svg.style('cursor', 'grab');
    }
    e.preventDefault();
  });
  document.addEventListener('keyup', function(e) {
    if (e.code !== 'Space') return;
    spaceDown = false;
    svg.style('cursor',
      mode === 'add-node' ? 'crosshair' :
      mode === 'add-edge' ? 'crosshair' : 'default'
    );
  });

  // ── Canvas click (add node) ────────────────────────────────────
  svg.on('click', function(event) {
    if (suppressNextClick) { suppressNextClick = false; return; }
    if (mode === 'add-node') {
      const [x, y] = d3.pointer(event, g.node());
      pushHistory();
      nodes.push({
        id: nextNodeId++,
        x: x,
        y: y,
        label: 'Node',
        colorIndex: 0,
      });
      render();
      save();
      setMode('select');
      return;
    }

    // Click on empty space = deselect
    if (event.target === this || event.target === g.node()) {
      clearSelection();
      if (mode === 'add-edge') {
        connectSource = null;
        previewLine.style('display', 'none');
        setMode('select');
      }
    }
  });

  // Preview line for edge creation
  svg.on('mousemove', function(event) {
    if (mode === 'add-edge' && connectSource) {
      const [x, y] = d3.pointer(event, g.node());
      previewLine
        .attr('d', `M${connectSource.x},${connectSource.y} L${x},${y}`)
        .style('display', null);
    }
  });

  // ── Label editing ──────────────────────────────────────────────
  function startEditLabel(node) {
    if (!node) return;
    selectOnly(node);

    const svgRect = document.querySelector('#canvas-svg').getBoundingClientRect();
    const transform = d3.zoomTransform(svg.node());
    const screenX = transform.applyX(node.x);
    const screenY = transform.applyY(node.y);

    const input = document.createElement('input');
    input.className = 'node-edit-input';
    input.value = node.label;
    input.style.left = (svgRect.left + screenX - 60) + 'px';
    input.style.top = (svgRect.top + screenY - 12) + 'px';
    input.style.width = '120px';

    document.body.appendChild(input);
    input.focus();
    input.select();

    function finish() {
      const val = input.value.trim();
      if (val && val !== node.label) {
        pushHistory();
        node.label = val;
        save();
      }
      input.remove();
      render();
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') finish();
      if (e.key === 'Escape') { input.remove(); }
    });
    input.addEventListener('blur', finish);
  }

  // ── Color picker ───────────────────────────────────────────────
  function buildColorPicker() {
    const picker = document.getElementById('color-picker');
    COLORS.forEach((c, i) => {
      const swatch = document.createElement('div');
      swatch.className = 'color-swatch';
      swatch.title = c.label;
      swatch.dataset.index = i;
      swatch.addEventListener('click', () => {
        if (selectedNodeIds.size > 0) {
          pushHistory();
          getSelectedNodes().forEach(n => { n.colorIndex = i; });
          updateColorPickerSelection();
          render();
          save();
        }
      });
      picker.appendChild(swatch);
    });
    updateSwatchColors();
  }

  function updateSwatchColors() {
    const dark = isDark();
    document.querySelectorAll('.color-swatch').forEach(s => {
      const c = COLORS[parseInt(s.dataset.index)];
      s.style.background = dark ? c.dark : c.light;
    });
  }

  function updateColorPickerSelection() {
    const sel = getSelectedNodes();
    document.querySelectorAll('.color-swatch').forEach(s => {
      const idx = parseInt(s.dataset.index);
      // Highlight if all selected nodes share this color
      s.classList.toggle('selected',
        sel.length > 0 && sel.every(n => (n.colorIndex || 0) === idx)
      );
    });
  }

  // ── Distribute ─────────────────────────────────────────────────
  function distributeH() {
    const sel = getSelectedNodes();
    if (sel.length < 3) return;
    pushHistory();
    sel.sort((a, b) => a.x - b.x);
    const minX = sel[0].x;
    const maxX = sel[sel.length - 1].x;
    const step = (maxX - minX) / (sel.length - 1);
    sel.forEach((n, i) => { n.x = minX + step * i; });
    render();
    save();
  }

  function distributeV() {
    const sel = getSelectedNodes();
    if (sel.length < 3) return;
    pushHistory();
    sel.sort((a, b) => a.y - b.y);
    const minY = sel[0].y;
    const maxY = sel[sel.length - 1].y;
    const step = (maxY - minY) / (sel.length - 1);
    sel.forEach((n, i) => { n.y = minY + step * i; });
    render();
    save();
  }

  // ── Toolbar button handlers ────────────────────────────────────
  document.getElementById('btn-add-node').addEventListener('click', () => {
    setMode(mode === 'add-node' ? 'select' : 'add-node');
  });

  document.getElementById('btn-add-edge').addEventListener('click', () => {
    setMode(mode === 'add-edge' ? 'select' : 'add-edge');
  });

  document.getElementById('btn-zoom-in').addEventListener('click', () => {
    svg.transition().duration(300).call(zoom.scaleBy, 1.4);
  });

  document.getElementById('btn-zoom-out').addEventListener('click', () => {
    svg.transition().duration(300).call(zoom.scaleBy, 0.7);
  });

  document.getElementById('btn-zoom-reset').addEventListener('click', fitToView);

  document.getElementById('btn-undo').addEventListener('click', undo);
  document.getElementById('btn-redo').addEventListener('click', redo);

  document.getElementById('btn-color').addEventListener('click', () => {
    const picker = document.getElementById('color-picker');
    picker.classList.toggle('visible');
    if (picker.classList.contains('visible')) {
      updateColorPickerSelection();
    }
  });

  document.getElementById('btn-distribute-h').addEventListener('click', distributeH);
  document.getElementById('btn-distribute-v').addEventListener('click', distributeV);

  document.getElementById('btn-delete').addEventListener('click', deleteSelected);

  document.getElementById('btn-share').addEventListener('click', () => {
    if (nodes.length === 0) {
      showToast('Nothing to share');
      return;
    }
    const url = window.location.origin + window.location.pathname + '#' + encodeState();
    navigator.clipboard.writeText(url).then(() => {
      showToast('Link copied to clipboard');
    }).catch(() => {
      showToast('Could not copy link');
    });
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    if (nodes.length === 0 && edges.length === 0) return;
    showConfirm('Clear all nodes and edges?', 'Clear all', () => {
      pushHistory();
      nodes = [];
      edges = [];
      nextNodeId = 1;
      nextEdgeId = 1;
      clearSelection();
      save();
    });
  });

  // ── Actions ────────────────────────────────────────────────────
  function deleteSelected() {
    if (selectedNodeIds.size === 0 && !selectedEdge) return;
    pushHistory();
    if (selectedNodeIds.size > 0) {
      const ids = new Set(selectedNodeIds);
      nodes = nodes.filter(n => !ids.has(n.id));
      edges = edges.filter(e => !ids.has(e.source) && !ids.has(e.target));
    } else if (selectedEdge) {
      edges = edges.filter(e => e.id !== selectedEdge.id);
    }
    clearSelection();
    save();
  }

  function fitToView() {
    if (nodes.length === 0) {
      svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
      return;
    }
    const padding = 60;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    nodes.forEach(n => {
      minX = Math.min(minX, n.x - NODE_W / 2);
      minY = Math.min(minY, n.y - NODE_H / 2);
      maxX = Math.max(maxX, n.x + NODE_W / 2);
      maxY = Math.max(maxY, n.y + NODE_H / 2);
    });
    const w = maxX - minX + padding * 2;
    const h = maxY - minY + padding * 2;
    const svgEl = document.getElementById('canvas-svg');
    const vw = svgEl.clientWidth;
    const vh = svgEl.clientHeight;
    const scale = Math.min(vw / w, vh / h, 2);
    const tx = vw / 2 - (minX + maxX) / 2 * scale;
    const ty = vh / 2 - (minY + maxY) / 2 * scale;
    svg.transition().duration(500).call(
      zoom.transform,
      d3.zoomIdentity.translate(tx, ty).scale(scale)
    );
  }

  // ── Keyboard shortcuts ─────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    // Ignore if editing text or modal is open
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (isModalOpen()) return;

    // Undo / Redo
    if ((e.metaKey || e.ctrlKey) && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      if (e.shiftKey) redo();
      else undo();
      return;
    }

    // Arrow-key nudge for selected nodes
    if (selectedNodeIds.size > 0 && e.key.startsWith('Arrow')) {
      e.preventDefault();
      const step = e.shiftKey ? 10 : 1;
      let dx = 0, dy = 0;
      if (e.key === 'ArrowLeft') dx = -step;
      else if (e.key === 'ArrowRight') dx = step;
      else if (e.key === 'ArrowUp') dy = -step;
      else if (e.key === 'ArrowDown') dy = step;
      if (!e.repeat) pushHistory();
      getSelectedNodes().forEach(n => { n.x += dx; n.y += dy; });
      render();
      save();
      return;
    }

    // Select all
    if ((e.metaKey || e.ctrlKey) && e.key === 'a') {
      e.preventDefault();
      selectAllNodes();
      return;
    }

    // Copy
    if ((e.metaKey || e.ctrlKey) && e.key === 'c') {
      if (selectedNodeIds.size > 0) {
        const sel = getSelectedNodes();
        const selIds = new Set(sel.map(n => n.id));
        clipboard = {
          nodes: sel.map(n => ({
            label: n.label,
            colorIndex: n.colorIndex || 0,
            dx: n.x - sel[0].x,
            dy: n.y - sel[0].y,
            origId: n.id,
          })),
          edges: edges.filter(e => selIds.has(e.source) && selIds.has(e.target))
            .map(e => ({ source: e.source, target: e.target })),
        };
        showToast(sel.length === 1 ? 'Node copied' : `${sel.length} nodes copied`);
      }
      return;
    }

    // Paste
    if ((e.metaKey || e.ctrlKey) && e.key === 'v') {
      if (clipboard && clipboard.nodes.length > 0) {
        pushHistory();
        const view = d3.zoomTransform(svg.node());
        const svgEl = document.getElementById('canvas-svg');
        const cx = (svgEl.clientWidth / 2 - view.x) / view.k;
        const cy = (svgEl.clientHeight / 2 - view.y) / view.k;

        // Single jitter for the whole group, so relative positions are preserved
        const jitterX = (Math.random() - 0.5) * 20;
        const jitterY = (Math.random() - 0.5) * 20;

        // Map old IDs to new IDs
        const idMap = new Map();
        const newNodes = [];
        clipboard.nodes.forEach(cn => {
          const newId = nextNodeId++;
          idMap.set(cn.origId, newId);
          const nn = {
            id: newId,
            x: cx + cn.dx + jitterX,
            y: cy + cn.dy + jitterY,
            label: cn.label,
            colorIndex: cn.colorIndex,
          };
          nodes.push(nn);
          newNodes.push(nn);
        });

        // Recreate edges between pasted nodes
        clipboard.edges.forEach(ce => {
          const newSource = idMap.get(ce.source);
          const newTarget = idMap.get(ce.target);
          if (newSource && newTarget) {
            edges.push({ id: nextEdgeId++, source: newSource, target: newTarget });
          }
        });

        // Select pasted nodes
        selectedNodeIds.clear();
        newNodes.forEach(n => selectedNodeIds.add(n.id));
        selectedEdge = null;
        updateSelectionButtons();
        render();
        save();
        showToast(newNodes.length === 1 ? 'Node pasted' : `${newNodes.length} nodes pasted`);
      }
      return;
    }

    switch (e.key) {
      case 'n': case 'N':
        setMode(mode === 'add-node' ? 'select' : 'add-node');
        break;
      case 'e': case 'E':
        setMode(mode === 'add-edge' ? 'select' : 'add-edge');
        break;
      case 'c': case 'C':
        if (selectedNodeIds.size > 0) {
          document.getElementById('btn-color').click();
        }
        break;
      case 'h': case 'H':
        distributeH();
        break;
      case 'v': case 'V':
        distributeV();
        break;
      case 'Delete': case 'Backspace':
        deleteSelected();
        break;
      case 'Escape':
        clearSelection();
        setMode('select');
        break;
      case '=': case '+':
        svg.transition().duration(300).call(zoom.scaleBy, 1.4);
        break;
      case '-':
        svg.transition().duration(300).call(zoom.scaleBy, 0.7);
        break;
      case '0':
        fitToView();
        break;
    }
  });

  // ── Theme changes ──────────────────────────────────────────────
  const observer = new MutationObserver(() => {
    updateSwatchColors();
    render();
  });
  observer.observe(document.documentElement, {
    attributes: true,
    attributeFilter: ['data-theme']
  });

  // ── Init ───────────────────────────────────────────────────────
  buildColorPicker();
  load();
  render();
  updateSelectionButtons();
  updateHistoryButtons();
  if (nodes.length > 0) fitToView();
})();
</script>
</body>
</html>
