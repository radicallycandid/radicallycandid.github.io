<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas</title>
<script src="/static/js/theme.js"></script>
<style>
  :root {
    --bg-color: #f0f0f0;
    --text-color: #4a4a4a;
    --text-muted: #808080;
    --heading-color: #000000;
    --border-color: #d0d0d0;
    --code-bg: #e2e2e2;
    --node-fill: #d0d0d0;
    --node-stroke: #4a4a4a;
    --node-selected: #888888;
    --edge-color: #b0b0b0;
    --toolbar-bg: #e8e8e8;
    --toolbar-border: #d0d0d0;
    --btn-bg: #d8d8d8;
    --btn-hover: #c8c8c8;
    --btn-active: #b0b0b0;
    --danger: #8b4040;
    --danger-hover: #a04848;
  }
  [data-theme="dark"] {
    --bg-color: #1e1e1e;
    --text-color: #b0b0b0;
    --text-muted: #808080;
    --heading-color: #ffffff;
    --border-color: #3a3a3a;
    --code-bg: #2a2a2a;
    --node-fill: #3a3a3a;
    --node-stroke: #b0b0b0;
    --node-selected: #888888;
    --edge-color: #555555;
    --toolbar-bg: #252525;
    --toolbar-border: #3a3a3a;
    --btn-bg: #333333;
    --btn-hover: #3e3e3e;
    --btn-active: #4a4a4a;
    --danger: #a05050;
    --danger-hover: #b85858;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-color);
    color: var(--text-color);
    font-family: 'ET Book', Georgia, serif;
    overflow: hidden;
    transition: background 0.2s, color 0.2s;
    display: flex;
    height: 100vh;
  }

  /* Sidebar toolbar */
  .toolbar {
    width: 200px;
    min-width: 200px;
    background: var(--toolbar-bg);
    border-right: 1px solid var(--toolbar-border);
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 8px;
    z-index: 10;
    transition: background 0.2s, border-color 0.2s;
    user-select: none;
  }

  .toolbar h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--heading-color);
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }

  .toolbar-section {
    margin-bottom: 12px;
  }

  .toolbar-section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .toolbar button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px 10px;
    background: var(--btn-bg);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    color: var(--text-color);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  .toolbar button:hover {
    background: var(--btn-hover);
  }

  .toolbar button:active {
    background: var(--btn-active);
  }

  .toolbar button.active {
    background: var(--btn-active);
    border-color: var(--node-stroke);
  }

  .toolbar button.danger {
    color: var(--danger);
    border-color: var(--danger);
  }

  .toolbar button.danger:hover {
    background: var(--danger-hover);
    color: #ffffff;
  }

  .toolbar button svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .toolbar .separator {
    height: 1px;
    background: var(--border-color);
    margin: 8px 0;
  }

  .toolbar .shortcut {
    font-size: 10px;
    color: var(--text-muted);
    margin-left: auto;
    font-family: 'Source Code Pro', monospace;
  }

  /* Color picker in toolbar */
  .color-picker {
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 0;
  }

  .color-picker.visible {
    display: flex;
  }

  .color-swatch {
    width: 24px;
    height: 24px;
    border-radius: 4px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
  }

  .color-swatch:hover {
    transform: scale(1.15);
  }

  .color-swatch.selected {
    border-color: var(--heading-color);
  }

  /* Canvas area */
  .canvas-area {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Node styles */
  .node-group { cursor: grab; }
  .node-group:active { cursor: grabbing; }

  .node-rect {
    rx: 4;
    ry: 4;
    stroke-width: 2;
    transition: stroke 0.15s;
  }

  .node-rect.selected {
    stroke-dasharray: 4 2;
  }

  .node-text {
    font-family: 'ET Book', Georgia, serif;
    font-size: 14px;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
    user-select: none;
  }

  /* Edge styles */
  .edge-path {
    fill: none;
    stroke-width: 2;
    pointer-events: stroke;
    cursor: pointer;
    transition: stroke 0.15s;
  }

  .edge-path:hover {
    stroke-width: 3;
  }

  .edge-path.selected {
    stroke-dasharray: 6 3;
    stroke-width: 3;
  }

  /* Connection preview line */
  .connection-preview {
    fill: none;
    stroke: var(--node-selected);
    stroke-width: 2;
    stroke-dasharray: 5 5;
    pointer-events: none;
  }

  /* Text editing */
  .node-edit-input {
    position: absolute;
    background: var(--code-bg);
    border: 1px solid var(--border-color);
    border-radius: 3px;
    color: var(--heading-color);
    font-family: 'ET Book', Georgia, serif;
    font-size: 14px;
    padding: 4px 8px;
    text-align: center;
    outline: none;
    z-index: 20;
  }

  /* Status bar */
  .status-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 28px;
    background: var(--toolbar-bg);
    border-top: 1px solid var(--toolbar-border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 11px;
    color: var(--text-muted);
    gap: 16px;
    transition: background 0.2s, border-color 0.2s;
  }

  /* ET Book font face */
  @font-face {
    font-family: 'ET Book';
    src: url('/static/css/et-book/et-book-roman-line-figures/et-book-roman-line-figures.woff') format('woff');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'ET Book';
    src: url('/static/css/et-book/et-book-bold-line-figures/et-book-bold-line-figures.woff') format('woff');
    font-weight: bold;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'Source Code Pro';
    src: local('Source Code Pro');
    font-display: swap;
  }

  /* Theme toggle button (created by theme.js) */
  .theme-toggle {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 20;
    background: var(--btn-bg);
    border: 1px solid var(--border-color);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-color);
    transition: background 0.15s;
    padding: 0;
  }
  .theme-toggle:hover { background: var(--btn-hover); }
  .theme-toggle svg { width: 18px; height: 18px; }
  [data-theme="dark"] .theme-toggle .sun { display: none; }
  [data-theme="dark"] .theme-toggle .moon { display: inline; }
  :root .theme-toggle .moon { display: none; }
  :root .theme-toggle .sun { display: inline; }

  /* Toast notification */
  .toast {
    position: fixed;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--code-bg);
    border: 1px solid var(--border-color);
    color: var(--text-color);
    padding: 8px 16px;
    border-radius: 4px;
    font-family: 'ET Book', Georgia, serif;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 30;
    pointer-events: none;
  }
  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="toolbar">
  <h2>Canvas</h2>

  <div class="toolbar-section">
    <div class="toolbar-section-label">Create</div>
    <button id="btn-add-node" title="Click on canvas to place a node">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="2" y="2" width="12" height="12" rx="2"/>
        <line x1="8" y1="5" x2="8" y2="11"/>
        <line x1="5" y1="8" x2="11" y2="8"/>
      </svg>
      Add node
      <span class="shortcut">N</span>
    </button>
    <button id="btn-add-edge" title="Drag from one node to another">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="3" cy="13" r="2"/>
        <circle cx="13" cy="3" r="2"/>
        <path d="M4.5 11.5 Q8 8 11.5 4.5"/>
      </svg>
      Add edge
      <span class="shortcut">E</span>
    </button>
  </div>

  <div class="separator"></div>

  <div class="toolbar-section">
    <div class="toolbar-section-label">View</div>
    <button id="btn-zoom-in">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="7" cy="7" r="5"/>
        <line x1="11" y1="11" x2="14" y2="14"/>
        <line x1="5" y1="7" x2="9" y2="7"/>
        <line x1="7" y1="5" x2="7" y2="9"/>
      </svg>
      Zoom in
      <span class="shortcut">+</span>
    </button>
    <button id="btn-zoom-out">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="7" cy="7" r="5"/>
        <line x1="11" y1="11" x2="14" y2="14"/>
        <line x1="5" y1="7" x2="9" y2="7"/>
      </svg>
      Zoom out
      <span class="shortcut">&minus;</span>
    </button>
    <button id="btn-zoom-reset">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="1" y="1" width="14" height="14" rx="2"/>
        <rect x="4" y="4" width="8" height="8" rx="1" stroke-dasharray="2 1"/>
      </svg>
      Fit to view
      <span class="shortcut">0</span>
    </button>
  </div>

  <div class="separator"></div>

  <div class="toolbar-section">
    <div class="toolbar-section-label">Selection</div>
    <button id="btn-edit-label" disabled>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M11.5 1.5l3 3-9 9H2.5v-3z"/>
        <line x1="9.5" y1="3.5" x2="12.5" y2="6.5"/>
      </svg>
      Edit label
      <span class="shortcut">F2</span>
    </button>
    <button id="btn-color" disabled>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="8" cy="8" r="6"/>
        <circle cx="8" cy="8" r="3" fill="currentColor" opacity="0.3"/>
      </svg>
      Color
    </button>
    <div class="color-picker" id="color-picker"></div>
    <button id="btn-delete" class="danger" disabled>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <line x1="4" y1="4" x2="12" y2="12"/>
        <line x1="12" y1="4" x2="4" y2="12"/>
      </svg>
      Delete
      <span class="shortcut">Del</span>
    </button>
  </div>

  <div class="separator"></div>

  <div class="toolbar-section">
    <div class="toolbar-section-label">Share</div>
    <button id="btn-share">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 8h8M8 4l4 4-4 4"/>
      </svg>
      Copy link
    </button>
  </div>

  <div style="flex:1"></div>

  <div class="toolbar-section">
    <button id="btn-clear" class="danger">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M3 4h10M6 4V3h4v1M5 4v9h6V4"/>
      </svg>
      Clear all
    </button>
  </div>
</div>

<div class="canvas-area">
  <svg id="canvas-svg"></svg>
  <div class="status-bar">
    <span id="status-mode">Select</span>
    <span id="status-info"></span>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(function() {
  'use strict';

  // ── State ──────────────────────────────────────────────────────
  const STORAGE_KEY = 'canvas-graph-state';
  const NODE_W = 160, NODE_H = 80;
  const COLORS = [
    { light: '#d0d0d0', dark: '#3a3a3a', label: 'Default' },
    { light: '#b8b8b8', dark: '#505050', label: 'Gray' },
    { light: '#c4b8a8', dark: '#4a4038', label: 'Warm' },
    { light: '#a8b8c4', dark: '#384450', label: 'Cool' },
    { light: '#b8c4b0', dark: '#3e4a38', label: 'Sage' },
    { light: '#c4b0b0', dark: '#4a3838', label: 'Rose' },
  ];

  let nodes = [];
  let edges = [];
  let nextNodeId = 1;
  let nextEdgeId = 1;
  let selectedNode = null;
  let selectedEdge = null;
  let mode = 'select'; // 'select' | 'add-node' | 'add-edge'
  let connectSource = null;

  // ── D3 Setup ───────────────────────────────────────────────────
  const svg = d3.select('#canvas-svg');
  const g = svg.append('g');

  // Layers
  const edgeLayer = g.append('g').attr('class', 'edge-layer');
  const nodeLayer = g.append('g').attr('class', 'node-layer');

  // Connection preview line
  const previewLine = g.append('path')
    .attr('class', 'connection-preview')
    .style('display', 'none');

  // Zoom
  const zoom = d3.zoom()
    .scaleExtent([0.1, 5])
    .on('zoom', (event) => g.attr('transform', event.transform));

  svg.call(zoom);

  // ── Helpers ────────────────────────────────────────────────────
  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function isDark() {
    return document.documentElement.getAttribute('data-theme') === 'dark';
  }

  function nodeColor(node) {
    const c = COLORS[node.colorIndex || 0];
    return isDark() ? c.dark : c.light;
  }

  function nodeStroke(node) {
    return cssVar('--node-stroke');
  }

  function save() {
    const state = { nodes, edges, nextNodeId, nextEdgeId };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }

  function load() {
    // Hash fragment takes priority (shared link)
    if (loadFromHash()) return;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const state = JSON.parse(raw);
      nodes = state.nodes || [];
      edges = state.edges || [];
      nextNodeId = state.nextNodeId || 1;
      nextEdgeId = state.nextEdgeId || 1;
    } catch(e) {}
  }

  function encodeState() {
    const state = { n: [], e: [] };
    nodes.forEach(nd => {
      const entry = [nd.id, Math.round(nd.x), Math.round(nd.y), nd.label];
      if (nd.colorIndex) entry.push(nd.colorIndex);
      state.n.push(entry);
    });
    edges.forEach(ed => {
      state.e.push([ed.source, ed.target]);
    });
    return btoa(encodeURIComponent(JSON.stringify(state)));
  }

  function loadFromHash() {
    const hash = window.location.hash.slice(1);
    if (!hash) return false;
    try {
      const state = JSON.parse(decodeURIComponent(atob(hash)));
      if (!state.n) return false;
      nodes = state.n.map(a => ({
        id: a[0], x: a[1], y: a[2], label: a[3], colorIndex: a[4] || 0
      }));
      edges = (state.e || []).map((a, i) => ({
        id: i + 1, source: a[0], target: a[1]
      }));
      nextNodeId = Math.max(0, ...nodes.map(n => n.id)) + 1;
      nextEdgeId = edges.length + 1;
      // Clear hash so edits don't stay on a stale shared URL
      history.replaceState(null, '', window.location.pathname);
      return true;
    } catch(e) { return false; }
  }

  function showToast(msg) {
    let toast = document.querySelector('.toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.className = 'toast';
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.classList.add('visible');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('visible'), 2000);
  }

  // ── Rendering ──────────────────────────────────────────────────
  function render() {
    renderEdges();
    renderNodes();
    updateStatusBar();
    save();
  }

  function renderNodes() {
    const groups = nodeLayer.selectAll('.node-group')
      .data(nodes, d => d.id);

    groups.exit().remove();

    const enter = groups.enter()
      .append('g')
      .attr('class', 'node-group')
      .attr('transform', d => `translate(${d.x},${d.y})`);

    enter.append('rect')
      .attr('class', 'node-rect')
      .attr('x', -NODE_W / 2)
      .attr('y', -NODE_H / 2)
      .attr('width', NODE_W)
      .attr('height', NODE_H);

    enter.append('text')
      .attr('class', 'node-text');

    // Drag
    enter.call(d3.drag()
      .on('start', onNodeDragStart)
      .on('drag', onNodeDrag)
      .on('end', onNodeDragEnd)
    );

    // Click
    enter.on('click', onNodeClick);
    enter.on('dblclick', (event, d) => {
      event.stopPropagation();
      startEditLabel(d);
    });

    // Update all (enter + existing)
    const all = nodeLayer.selectAll('.node-group')
      .data(nodes, d => d.id);

    all.attr('transform', d => `translate(${d.x},${d.y})`);

    all.select('.node-rect')
      .attr('fill', d => nodeColor(d))
      .attr('stroke', d => d === selectedNode ? cssVar('--node-selected') : nodeStroke(d))
      .classed('selected', d => d === selectedNode);

    all.select('.node-text')
      .text(d => d.label)
      .attr('fill', () => cssVar('--heading-color'));
  }

  function renderEdges() {
    const paths = edgeLayer.selectAll('.edge-path')
      .data(edges, d => d.id);

    paths.exit().remove();

    const enter = paths.enter()
      .append('path')
      .attr('class', 'edge-path')
      .on('click', onEdgeClick);

    const all = edgeLayer.selectAll('.edge-path')
      .data(edges, d => d.id);

    all.attr('d', d => {
        const s = nodes.find(n => n.id === d.source);
        const t = nodes.find(n => n.id === d.target);
        if (!s || !t) return '';
        return `M${s.x},${s.y} L${t.x},${t.y}`;
      })
      .attr('stroke', d => d === selectedEdge ? cssVar('--node-selected') : cssVar('--edge-color'))
      .classed('selected', d => d === selectedEdge);
  }

  function smoothEdge(x1, y1, x2, y2) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    // Cubic bezier with control points offset perpendicular to the line
    const dist = Math.sqrt(dx * dx + dy * dy);
    const curvature = Math.min(dist * 0.2, 60);
    // Midpoint
    const mx = (x1 + x2) / 2;
    const my = (y1 + y2) / 2;
    // Normal direction
    const nx = -dy / (dist || 1);
    const ny = dx / (dist || 1);
    // Control point offset from midpoint
    const cx = mx + nx * curvature;
    const cy = my + ny * curvature;
    return `M${x1},${y1} Q${cx},${cy} ${x2},${y2}`;
  }

  // ── Interaction ────────────────────────────────────────────────
  function setMode(newMode) {
    mode = newMode;
    document.getElementById('btn-add-node').classList.toggle('active', mode === 'add-node');
    document.getElementById('btn-add-edge').classList.toggle('active', mode === 'add-edge');
    svg.style('cursor',
      mode === 'add-node' ? 'crosshair' :
      mode === 'add-edge' ? 'crosshair' : 'default'
    );
    if (mode !== 'add-edge') {
      connectSource = null;
      previewLine.style('display', 'none');
    }
    updateStatusBar();
  }

  function clearSelection() {
    selectedNode = null;
    selectedEdge = null;
    updateSelectionButtons();
    render();
  }

  function selectNode(node) {
    selectedNode = node;
    selectedEdge = null;
    updateSelectionButtons();
    render();
  }

  function selectEdge(edge) {
    selectedEdge = edge;
    selectedNode = null;
    updateSelectionButtons();
    render();
  }

  function updateSelectionButtons() {
    const hasNodeSel = !!selectedNode;
    const hasAnySel = hasNodeSel || !!selectedEdge;
    document.getElementById('btn-edit-label').disabled = !hasNodeSel;
    document.getElementById('btn-color').disabled = !hasNodeSel;
    document.getElementById('btn-delete').disabled = !hasAnySel;
    if (!hasNodeSel) {
      document.getElementById('color-picker').classList.remove('visible');
    }
  }

  function updateStatusBar() {
    const modeLabel = {
      'select': 'Select',
      'add-node': 'Add node (click canvas)',
      'add-edge': connectSource ? 'Click target node' : 'Click source node',
    };
    document.getElementById('status-mode').textContent = modeLabel[mode] || 'Select';
    document.getElementById('status-info').textContent =
      `${nodes.length} node${nodes.length !== 1 ? 's' : ''}, ${edges.length} edge${edges.length !== 1 ? 's' : ''}`;
  }

  // ── Node interaction ───────────────────────────────────────────
  let dragMoved = false;

  function onNodeDragStart(event, d) {
    dragMoved = false;
    if (mode === 'add-edge') return; // Don't drag in edge mode
    event.sourceEvent.stopPropagation();
  }

  function onNodeDrag(event, d) {
    if (mode === 'add-edge') return;
    dragMoved = true;
    d.x = event.x;
    d.y = event.y;
    render();
  }

  function onNodeDragEnd(event, d) {
    if (mode === 'add-edge') return;
    if (dragMoved) save();
  }

  function onNodeClick(event, d) {
    event.stopPropagation();

    if (mode === 'add-edge') {
      if (!connectSource) {
        connectSource = d;
        selectNode(d);
        updateStatusBar();
      } else if (connectSource.id !== d.id) {
        // Check if edge already exists
        const exists = edges.some(e =>
          (e.source === connectSource.id && e.target === d.id) ||
          (e.source === d.id && e.target === connectSource.id)
        );
        if (!exists) {
          edges.push({
            id: nextEdgeId++,
            source: connectSource.id,
            target: d.id,
          });
        }
        connectSource = null;
        previewLine.style('display', 'none');
        clearSelection();
        setMode('select');
      }
      return;
    }

    if (dragMoved) return;
    if (selectedNode === d) {
      clearSelection();
    } else {
      selectNode(d);
    }
  }

  function onEdgeClick(event, d) {
    event.stopPropagation();
    if (mode !== 'select') return;
    if (selectedEdge === d) {
      clearSelection();
    } else {
      selectEdge(d);
    }
  }

  // ── Canvas click (add node) ────────────────────────────────────
  svg.on('click', function(event) {
    if (mode === 'add-node') {
      const [x, y] = d3.pointer(event, g.node());
      nodes.push({
        id: nextNodeId++,
        x: x,
        y: y,
        label: 'Node',
        colorIndex: 0,
      });
      render();
      setMode('select');
      return;
    }

    // Click on empty space = deselect
    if (event.target === this || event.target === g.node()) {
      clearSelection();
      if (mode === 'add-edge') {
        connectSource = null;
        previewLine.style('display', 'none');
        setMode('select');
      }
    }
  });

  // Preview line for edge creation
  svg.on('mousemove', function(event) {
    if (mode === 'add-edge' && connectSource) {
      const [x, y] = d3.pointer(event, g.node());
      previewLine
        .attr('d', `M${connectSource.x},${connectSource.y} L${x},${y}`)
        .style('display', null);
    }
  });

  // ── Label editing ──────────────────────────────────────────────
  function startEditLabel(node) {
    if (!node) return;
    selectNode(node);

    const svgRect = document.querySelector('#canvas-svg').getBoundingClientRect();
    const transform = d3.zoomTransform(svg.node());
    const screenX = transform.applyX(node.x);
    const screenY = transform.applyY(node.y);

    const input = document.createElement('input');
    input.className = 'node-edit-input';
    input.value = node.label;
    input.style.left = (svgRect.left + screenX - 60) + 'px';
    input.style.top = (svgRect.top + screenY - 12) + 'px';
    input.style.width = '120px';

    document.body.appendChild(input);
    input.focus();
    input.select();

    function finish() {
      const val = input.value.trim();
      if (val) node.label = val;
      input.remove();
      render();
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') finish();
      if (e.key === 'Escape') { input.remove(); }
    });
    input.addEventListener('blur', finish);
  }

  // ── Color picker ───────────────────────────────────────────────
  function buildColorPicker() {
    const picker = document.getElementById('color-picker');
    COLORS.forEach((c, i) => {
      const swatch = document.createElement('div');
      swatch.className = 'color-swatch';
      swatch.title = c.label;
      swatch.dataset.index = i;
      swatch.addEventListener('click', () => {
        if (selectedNode) {
          selectedNode.colorIndex = i;
          updateColorPickerSelection();
          render();
        }
      });
      picker.appendChild(swatch);
    });
    updateSwatchColors();
  }

  function updateSwatchColors() {
    const dark = isDark();
    document.querySelectorAll('.color-swatch').forEach(s => {
      const c = COLORS[parseInt(s.dataset.index)];
      s.style.background = dark ? c.dark : c.light;
    });
  }

  function updateColorPickerSelection() {
    document.querySelectorAll('.color-swatch').forEach(s => {
      s.classList.toggle('selected',
        selectedNode && parseInt(s.dataset.index) === (selectedNode.colorIndex || 0)
      );
    });
  }

  // ── Toolbar button handlers ────────────────────────────────────
  document.getElementById('btn-add-node').addEventListener('click', () => {
    setMode(mode === 'add-node' ? 'select' : 'add-node');
  });

  document.getElementById('btn-add-edge').addEventListener('click', () => {
    setMode(mode === 'add-edge' ? 'select' : 'add-edge');
  });

  document.getElementById('btn-zoom-in').addEventListener('click', () => {
    svg.transition().duration(300).call(zoom.scaleBy, 1.4);
  });

  document.getElementById('btn-zoom-out').addEventListener('click', () => {
    svg.transition().duration(300).call(zoom.scaleBy, 0.7);
  });

  document.getElementById('btn-zoom-reset').addEventListener('click', fitToView);

  document.getElementById('btn-edit-label').addEventListener('click', () => {
    if (selectedNode) startEditLabel(selectedNode);
  });

  document.getElementById('btn-color').addEventListener('click', () => {
    const picker = document.getElementById('color-picker');
    picker.classList.toggle('visible');
    if (picker.classList.contains('visible')) {
      updateColorPickerSelection();
    }
  });

  document.getElementById('btn-delete').addEventListener('click', deleteSelected);

  document.getElementById('btn-share').addEventListener('click', () => {
    if (nodes.length === 0) {
      showToast('Nothing to share');
      return;
    }
    const url = window.location.origin + window.location.pathname + '#' + encodeState();
    navigator.clipboard.writeText(url).then(() => {
      showToast('Link copied to clipboard');
    }).catch(() => {
      showToast('Could not copy link');
    });
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    if (nodes.length === 0 && edges.length === 0) return;
    if (!confirm('Clear all nodes and edges?')) return;
    nodes = [];
    edges = [];
    nextNodeId = 1;
    nextEdgeId = 1;
    clearSelection();
    render();
  });

  // ── Actions ────────────────────────────────────────────────────
  function deleteSelected() {
    if (selectedNode) {
      const id = selectedNode.id;
      nodes = nodes.filter(n => n.id !== id);
      edges = edges.filter(e => e.source !== id && e.target !== id);
      clearSelection();
    } else if (selectedEdge) {
      edges = edges.filter(e => e.id !== selectedEdge.id);
      clearSelection();
    }
    render();
  }

  function fitToView() {
    if (nodes.length === 0) {
      svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
      return;
    }
    const padding = 60;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    nodes.forEach(n => {
      minX = Math.min(minX, n.x - NODE_W / 2);
      minY = Math.min(minY, n.y - NODE_H / 2);
      maxX = Math.max(maxX, n.x + NODE_W / 2);
      maxY = Math.max(maxY, n.y + NODE_H / 2);
    });
    const w = maxX - minX + padding * 2;
    const h = maxY - minY + padding * 2;
    const svgEl = document.getElementById('canvas-svg');
    const vw = svgEl.clientWidth;
    const vh = svgEl.clientHeight;
    const scale = Math.min(vw / w, vh / h, 2);
    const tx = vw / 2 - (minX + maxX) / 2 * scale;
    const ty = vh / 2 - (minY + maxY) / 2 * scale;
    svg.transition().duration(500).call(
      zoom.transform,
      d3.zoomIdentity.translate(tx, ty).scale(scale)
    );
  }

  // ── Keyboard shortcuts ─────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    // Ignore if editing text
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    switch (e.key) {
      case 'n': case 'N':
        setMode(mode === 'add-node' ? 'select' : 'add-node');
        break;
      case 'e': case 'E':
        setMode(mode === 'add-edge' ? 'select' : 'add-edge');
        break;
      case 'Delete': case 'Backspace':
        deleteSelected();
        break;
      case 'F2':
        if (selectedNode) startEditLabel(selectedNode);
        e.preventDefault();
        break;
      case 'Escape':
        clearSelection();
        setMode('select');
        break;
      case '=': case '+':
        svg.transition().duration(300).call(zoom.scaleBy, 1.4);
        break;
      case '-':
        svg.transition().duration(300).call(zoom.scaleBy, 0.7);
        break;
      case '0':
        fitToView();
        break;
    }
  });

  // ── Theme changes ──────────────────────────────────────────────
  const observer = new MutationObserver(() => {
    updateSwatchColors();
    render();
  });
  observer.observe(document.documentElement, {
    attributes: true,
    attributeFilter: ['data-theme']
  });

  // ── Init ───────────────────────────────────────────────────────
  buildColorPicker();
  load();
  render();
  updateSelectionButtons();
})();
</script>
</body>
</html>
