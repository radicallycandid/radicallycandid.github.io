<script>
// ?embed hides standalone chrome; ?lang=pt|en picks the strings (default en).
const params = new URLSearchParams(window.location.search);
const isEmbed = params.has('embed');
const LANG = params.get('lang') === 'pt' ? 'pt' : 'en';
document.documentElement.lang = LANG;
if (isEmbed) {
  document.documentElement.classList.add('embed');
}
// Theme sync: when the parent page (same origin) toggles the theme, theme.js
// writes localStorage, which fires a storage event in this frame.
window.addEventListener('storage', function(e) {
  if (e.key === 'theme-preference' && e.newValue) {
    document.documentElement.setAttribute('data-theme', e.newValue);
  }
});
</script>

    width: 100%;
    height: 100vh;
  }
  svg { display: block; }

  .edge.copy { stroke-dasharray: 5 3; }
  .node rect {
    fill: var(--node-fill);
    stroke: var(--node-stroke);
    stroke-width: 1.2px;
    cursor: default;
    transition: fill 0.2s, stroke 0.2s, opacity 0.2s;

  .node.process rect { cursor: pointer; }

    stroke: var(--heading-color);

    pointer-events: none;

    font-size: 11px;

    font-family: 'Inter', system-ui, sans-serif;
    font-size: 12px;

    font-weight: 600;

    align-items: flex-start;

  .detail-col { flex: 1; min-width: 0; }
  .detail-label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 4px;
    text-transform: uppercase;

  .detail-col pre {
    background: var(--code-bg);
    border-radius: 4px;
    padding: 8px 10px;
    overflow-x: auto;
    margin: 0;
    transition: background 0.2s;

    font-size: 10px;
    line-height: 1.5;
    color: var(--text-color);
    white-space: pre;

    font-size: 16px;
    color: var(--text-muted);
    margin-top: 22px;
    flex-shrink: 0;

  .detail-explain {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
    line-height: 1.5;

  .instructions {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--code-bg);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 6px 14px;
    color: var(--text-muted);
    font-size: 10px;
    text-align: center;
    white-space: nowrap;

    z-index: 10;

  .theme-toggle {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 2rem;
    height: 2rem;
    border-radius: 50%;
    border: 1px solid var(--border-color);
    background: var(--code-bg);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;

  .center-btn {

  <p>Este site inteiro \u00e9...</p>
</section>`,
    explain: 'Substitui {{placeholders}} por valores numa passada s\u00f3, ent\u00e3o o texto rec\u00e9m-inserido nunca \u00e9 lido de novo. Cada p\u00e1gina passa pelo template de conte\u00fado primeiro, depois \u00e9 envolvida pelo template base com header, navega\u00e7\u00e3o e seletor de idioma. Um placeholder sem valor no contexto interrompe o build com erro.'
  },
  'proc-listings': {
    title: '\u00cdndice & Feeds',
    before: `Metadados de todos os posts:
[
 { title: "EM e PM...",
   date: "2026-02-27",
   draft: false },
 { title: "Como este site...",
   date: "2026-03-03",
   draft: true },
 { title: "IA vai borrar...",
   date: "2026-02-26",
   draft: false }
]`,
    after: `<!-- index.html (rascunhos ocultos) -->

  o qu\u00ea</h2>

</div>

 <h2>IA vai borrar pap\u00e9is
  adjacentes</h2>

</div>

<!-- feed.xml -->
<entry>
 <title>EM e PM...</title>
 <updated>2026-02-27</updated>
</entry>`,
    explain: 'Coleta metadados de todos os posts. Filtra rascunhos (ainda constru\u00eddos, mas ocultos), ordena por data (mais recente primeiro) e gera a listagem da homepage e o feed Atom XML.'
  }
};

const T = STRINGS[LANG];
document.title = T.title;
document.getElementById('instructions').textContent = T.instructions;
document.getElementById('center-btn').textContent = T.center;
nodes.forEach(n => Object.assign(n, T.nodes[n.id]));
document.getElementById('label-before').textContent = T.before;
document.getElementById('label-after').textContent = T.after;
const detailData = T.details;

const nodeMap = {};
nodes.forEach(n => nodeMap[n.id] = n);

const edges = [
  { source: 'src-posts',        target: 'proc-frontmatter', type: 'horizontal' },
  { source: 'src-pages',        target: 'proc-frontmatter', type: 'horizontal' },
  { source: 'src-templates',    target: 'proc-template',    type: 'horizontal' },
  { source: 'proc-frontmatter', target: 'proc-markdown',    type: 'vertical' },
  { source: 'proc-markdown',    target: 'proc-tufte',       type: 'vertical' },
  { source: 'proc-tufte',       target: 'proc-toc',         type: 'vertical' },
  { source: 'proc-toc',         target: 'proc-template',    type: 'vertical' },
  { source: 'proc-frontmatter', target: 'proc-listings',    type: 'branch' },
  { source: 'proc-template',    target: 'out-posts',        type: 'horizontal' },
  { source: 'proc-listings',    target: 'out-index',        type: 'horizontal' },
  { source: 'proc-listings',    target: 'out-feed',         type: 'horizontal' },
  { source: 'src-static',       target: 'out-static',       type: 'copy' },
];

// Compute SVG paths for edges
edges.forEach(e => {
  const s = nodeMap[e.source], t = nodeMap[e.target];
  if (e.type === 'vertical') {
    e.path = `M ${s.x},${s.y + NH/2} L ${t.x},${t.y - NH/2}`;
  } else if (e.type === 'branch') {
    const sx = s.x + NW/2, sy = s.y;
    const tx = t.x + NW/2, ty = t.y;
    e.path = `M ${sx},${sy} C ${sx + 70},${sy} ${tx + 70},${ty} ${tx},${ty}`;
  } else {
    // horizontal and copy
    const sx = s.x + NW/2, sy = s.y;
    const tx = t.x - NW/2, ty = t.y;
    e.path = d3.linkHorizontal()({ source: [sx, sy], target: [tx, ty] });
  }
});


// --- SVG setup ---
const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select("body").append("svg")
  .attr("width", width)
  .attr("height", height)
  .attr("viewBox", "0 0 960 580")
  .attr("preserveAspectRatio", "xMidYMid meet");

const g = svg.append("g");

const zoom = d3.zoom()
  .scaleExtent([0.5, 3])
  .on("zoom", (event) => g.attr("transform", event.transform));
svg.call(zoom);

// --- Column headers ---
const headers = [
  { label: T.columns[0], x: 115, y: 40 },
  { label: T.columns[1], x: 450, y: 40 },
  { label: T.columns[2], x: 810, y: 40 },
];

g.selectAll(".col-header")
  .data(headers)
  .join("text")
  .attr("class", "col-header")
  .attr("x", d => d.x)
  .attr("y", d => d.y)
  .text(d => d.label);

// Subtitle under PROCESSING
g.append("text")
  .attr("class", "col-header")
  .attr("x", 450)
  .attr("y", 53)
  .style("font-size", "8px")
  .style("font-weight", "400")
  .style("letter-spacing", "0.05em")
  .style("text-transform", "none")
  .text("build.py");

// --- Edges ---
const edgeGroup = g.append("g");

const edgePaths = edgeGroup.selectAll("path")
  .data(edges)
  .join("path")
  .attr("class", d => "edge" + (d.type === "copy" ? " copy" : ""))
  .attr("d", d => d.path);

// --- Nodes ---
const nodeGroup = g.append("g");

const nodeGs = nodeGroup.selectAll("g")
  .data(nodes)
  .join("g")
  .attr("class", d => "node " + d.type)
  .attr("data-id", d => d.id)
  .attr("transform", d => `translate(${d.x - NW/2}, ${d.y - NH/2})`);

nodeGs.append("rect")
  .attr("width", NW)
  .attr("height", NH)
  .attr("rx", NR);

nodeGs.append("text")
  .attr("class", d => d.type === 'process' ? 'label' : 'filepath')
  .attr("x", NW / 2)
  .attr("y", NH / 2 + 4)
  .attr("text-anchor", "middle")
  .text(d => d.label);

// --- Interactions ---
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function getConnected(nodeId) {
  const connected = new Set();
  edges.forEach(e => {
    if (e.source === nodeId) connected.add(e.target);
    if (e.target === nodeId) connected.add(e.source);
  });
  return connected;
}

const tooltip = d3.select("#tooltip");

nodeGs.on("mouseover", function(event, d) {
  const connected = getConnected(d.id);

  edgePaths
    .attr("stroke-opacity", e =>
      (e.source === d.id || e.target === d.id) ? 1 : 0.12)
    .attr("stroke-width", e =>
      (e.source === d.id || e.target === d.id) ? 2.5 : 1.5)
    .attr("stroke", e =>
      (e.source === d.id || e.target === d.id) ? cssVar('--link-hover') : cssVar('--link-color'));

  nodeGs.select("rect").attr("opacity", n =>
    n.id === d.id || connected.has(n.id) ? 1 : 0.15);
  nodeGs.selectAll("text").attr("opacity", n =>
    n.id === d.id || connected.has(n.id) ? 1 : 0.15);

  tooltip
    .html(`<b>${d.label}</b><br><span class="desc">${d.desc}</span>`)
    .style("opacity", 1);
  positionTooltip(event);
})
.on("mousemove", positionTooltip)
.on("mouseout", function() {
  edgePaths
    .attr("stroke-opacity", 1)
    .attr("stroke-width", 1.5)
    .attr("stroke", cssVar('--link-color'));
  nodeGs.select("rect").attr("opacity", 1);
  nodeGs.selectAll("text").attr("opacity", 1);
  tooltip.style("opacity", 0);
});

function positionTooltip(event) {
  let x = event.pageX + 14;
  let y = event.pageY - 14;
  const tt = tooltip.node();
  const ttW = tt.offsetWidth, ttH = tt.offsetHeight;
  if (x + ttW > width - 8) x = event.pageX - ttW - 14;
  if (y + ttH > height - 8) y = height - ttH - 8;
  if (y < 8) y = 8;
  tooltip.style("left", x + "px").style("top", y + "px");
}

// Click on processing nodes to show detail
let selectedNode = null;

nodeGs.filter(d => d.type === 'process').on("click", function(event, d) {
  event.stopPropagation();
  if (detailData[d.id]) {
    showDetail(d.id);
  }
});

svg.on("click", function() {
  closeDetail();
});

function showDetail(nodeId) {
  const data = detailData[nodeId];
  if (!data) return;
  document.getElementById('detail-title').textContent = data.title;
  document.getElementById('detail-before').textContent = data.before;
  document.getElementById('detail-after').textContent = data.after;
  document.getElementById('detail-explain').textContent = data.explain;
  document.getElementById('detail-panel').classList.add('active');
  document.getElementById('instructions').classList.add('hidden');

  if (selectedNode) {
    d3.select(`[data-id="${selectedNode}"]`).classed('selected', false);
  }
  selectedNode = nodeId;
  d3.select(`[data-id="${nodeId}"]`).classed('selected', true);
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('active');
  document.getElementById('instructions').classList.remove('hidden');
  if (selectedNode) {
    d3.select(`[data-id="${selectedNode}"]`).classed('selected', false);
    selectedNode = null;
  }
}

// --- Center / fit ---
function centerGraph() {
  const pad = 40;
  const minX = d3.min(nodes, n => n.x - NW/2) - pad;
  const maxX = d3.max(nodes, n => n.x + NW/2) + pad;
  const minY = d3.min(nodes, n => n.y - NH/2) - pad - 20;
  const maxY = d3.max(nodes, n => n.y + NH/2) + pad;
  const gw = maxX - minX, gh = maxY - minY;
  const midX = (minX + maxX) / 2, midY = (minY + maxY) / 2;

  // Use viewBox dimensions as reference (960x580)
  const vw = 960, vh = 580;
  const scale = Math.min(vw / gw, vh / gh, 1.2) * 0.9;
  const tx = vw / 2 - midX * scale;
  const ty = vh / 2 - midY * scale;

  svg.transition().duration(600).call(
    zoom.transform,
    d3.zoomIdentity.translate(tx, ty).scale(scale)
  );
}

centerGraph();
</script>
</body>
</html>
