<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repository Architecture - vmargato.com</title>
<link href="/static/css/embed-fonts.css" rel="stylesheet">
<script src="/static/js/theme.js"></script>
<script>
// ?embed hides standalone chrome; ?lang=pt|en picks the strings (default en).
const params = new URLSearchParams(window.location.search);
const isEmbed = params.has('embed');
const LANG = params.get('lang') === 'pt' ? 'pt' : 'en';
document.documentElement.lang = LANG;
if (isEmbed) {
  document.documentElement.classList.add('embed');
}
// Theme sync: when the parent page (same origin) toggles the theme, theme.js
// writes localStorage, which fires a storage event in this frame.
window.addEventListener('storage', function(e) {
  if (e.key === 'theme-preference' && e.newValue) {
    document.documentElement.setAttribute('data-theme', e.newValue);
  }
});
</script>
<style>
  :root {
    --bg-color: #e8e8e8;
    --text-color: #4a4a4a;
    --text-muted: #808080;
    --heading-color: #000000;
    --border-color: #d0d0d0;
    --code-bg: #dcdcdc;
    --node-fill: #d0d0d0;
    --node-stroke: #4a4a4a;
    --link-color: #c0c0c0;
    --link-hover: #4a4a4a;
  }
  [data-theme="dark"] {
    --bg-color: #252525;
    --text-color: #b0b0b0;
    --text-muted: #808080;
    --heading-color: #ffffff;
    --border-color: #3a3a3a;
    --code-bg: #303030;
    --node-fill: #3a3a3a;
    --node-stroke: #b0b0b0;
    --link-color: #444444;
    --link-hover: #b0b0b0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg-color);
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
    transition: background 0.2s;
    position: relative;
    width: 100%;
    height: 100vh;
  }
  svg { display: block; }
  .edge {
    stroke: var(--link-color);
    stroke-width: 1.5px;
    fill: none;
    transition: stroke 0.2s, stroke-opacity 0.2s;
  }
  .edge.copy { stroke-dasharray: 5 3; }
  .edge.data { stroke-dasharray: 4 3; }
  .node rect {
    fill: var(--node-fill);
    stroke: var(--node-stroke);
    stroke-width: 1.2px;
    cursor: default;
    transition: fill 0.2s, stroke 0.2s, opacity 0.2s;
  }
  .node text {
    fill: var(--text-color);
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .node .label {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 11px;
    font-weight: 500;
  }
  .node .filepath {
    font-family: 'Source Code Pro', monospace;
    font-size: 10.5px;
    font-weight: 400;
  }
  .col-header {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    fill: var(--text-muted);
    text-anchor: middle;
  }
  .tooltip {
    position: absolute;
    background: var(--code-bg);
    border: 1px solid var(--border-color);
    color: var(--text-color);
    padding: 10px 14px;
    border-radius: 6px;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    max-width: 280px;
    line-height: 1.5;
    z-index: 30;
  }
  .tooltip b { color: var(--heading-color); font-weight: 600; }
  .tooltip .desc { color: var(--text-muted); }
  .instructions {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--code-bg);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 6px 14px;
    color: var(--text-muted);
    font-size: 10px;
    text-align: center;
    white-space: nowrap;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
    z-index: 10;
  }
  .center-btn {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: var(--code-bg);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 5px 10px;
    color: var(--text-muted);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 10px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
    z-index: 10;
  }
  .center-btn:hover { border-color: var(--text-color); color: var(--text-color); }
  .embed .theme-toggle,
  .embed .instructions { display: none; }
</style>
</head>
<body>

<div class="tooltip" id="tooltip"></div>

<div class="instructions" id="instructions"></div>

<button class="center-btn" id="center-btn" onclick="centerGraph()"></button>

<script src="/static/vendor/d3-7.9.0.min.js"></script>
<script>
// --- Data ---
const NW = 160, NH = 30, NR = 6;

const nodes = [
  // Sources
  { id: 'posts-en',  type: 'source', label: 'posts/en/*.md',     x: 120, y: 80 },
  { id: 'posts-pt',  type: 'source', label: 'posts/pt/*.md',     x: 120, y: 130 },
  { id: 'templates', type: 'source', label: 'templates/',         x: 120, y: 230 },
  { id: 'pages-en',  type: 'source', label: 'pages/en/about.md', x: 120, y: 340 },
  { id: 'pages-pt',  type: 'source', label: 'pages/pt/about.md', x: 120, y: 390 },
  { id: 'static',    type: 'source', label: 'static/',            x: 120, y: 490 },

  // Build functions
  { id: 'build-post',    type: 'process', label: 'build_post()',    x: 460, y: 230 },
  { id: 'build-index',   type: 'process', label: 'build_index()',   x: 460, y: 365 },
  { id: 'build-feed',    type: 'process', label: 'build_feed()',    x: 460, y: 450 },
  { id: 'copy-static',   type: 'process', label: 'copy_static()',   x: 460, y: 490 },
  { id: 'root-redirect', type: 'process', label: 'build_root_index()', x: 460, y: 550 },

  // Outputs
  { id: 'out-posts-en',  type: 'output', label: 'en/posts/*.html', x: 800, y: 200 },
  { id: 'out-posts-pt',  type: 'output', label: 'pt/posts/*.html', x: 800, y: 260 },
  { id: 'out-index-en',  type: 'output', label: 'en/index.html',   x: 800, y: 340 },
  { id: 'out-index-pt',  type: 'output', label: 'pt/index.html',   x: 800, y: 390 },
  { id: 'out-feed-en',   type: 'output', label: 'en/feed.xml',     x: 800, y: 435 },
  { id: 'out-feed-pt',   type: 'output', label: 'pt/feed.xml',     x: 800, y: 465 },
  { id: 'out-static',    type: 'output', label: 'output/static/',   x: 800, y: 490 },
  { id: 'out-root',      type: 'output', label: 'index.html',       x: 800, y: 550 },
];

// --- Strings ---
// Everything user-facing, per language. Node entries add desc to the nodes
// above; file and function names stay untranslated.
const STRINGS = {
  en: {
    title: 'Repository Architecture - vmargato.com',
    instructions: 'Hover over any node to trace its connections',
    center: 'Center',
    columns: ['SOURCES', 'BUILD.PY', 'OUTPUT'],
    nodes: {
      'posts-en':      { desc: 'English blog posts. Each has YAML frontmatter (title, date, excerpt) and a Markdown body.' },
      'posts-pt':      { desc: 'Portuguese blog posts. Paired with English posts by matching filename slugs.' },
      'templates':     { desc: 'Four HTML templates: base.html (site shell), post.html, page.html, and index.html. Used by build_post, build_page and build_index to structure output.' },
      'pages-en':      { desc: 'English about page. Its rendered content is inlined into the homepage by build_index.' },
      'pages-pt':      { desc: 'Portuguese about page. Inlined into the Portuguese homepage.' },
      'static':        { desc: 'CSS (Tufte + custom theme), JavaScript (theme toggle, language, TOC), self-hosted fonts (ET Book, Source Code Pro, Inter), a vendored copy of D3.js, and the interactive embeds.' },
      'build-post':    { desc: 'For each post: parse frontmatter, convert Markdown to HTML with the Tufte extension (sidenotes, margin notes), extract headings for TOC, render through post.html then base.html.' },
      'build-index':   { desc: 'Build the homepage: inline about page content, list non-draft posts sorted by date (newest first), render through index.html then base.html.' },
      'build-feed':    { desc: 'Generate an Atom XML feed with the 20 most recent non-draft posts. Used by RSS readers.' },
      'copy-static':   { desc: 'Copy the entire static/ directory to output/static/ without any modification.' },
      'root-redirect': { desc: 'Write the root index.html: the Portuguese homepage, plus a small head script that sends the visitor to en/ if they chose English before (localStorage) or their browser language starts with en.' },
      'out-posts-en':  { desc: 'Rendered English blog posts. Each has Tufte sidenotes, optional TOC sidebar, and a language toggle linking to the Portuguese version.' },
      'out-posts-pt':  { desc: 'Rendered Portuguese blog posts. Same structure, with the language toggle linking back to English.' },
      'out-index-en':  { desc: 'English homepage. About section at the top, followed by blog posts listed newest first (drafts excluded).' },
      'out-index-pt':  { desc: 'Portuguese homepage. Same layout with translated content.' },
      'out-feed-en':   { desc: 'Atom feed for English posts. Up to 20 most recent entries.' },
      'out-feed-pt':   { desc: 'Atom feed for Portuguese posts.' },
      'out-static':    { desc: 'CSS, JavaScript, fonts, and embeds copied unchanged from the source static/ directory.' },
      'out-root':      { desc: 'Root page. Shows the Portuguese homepage directly; English readers get redirected to en/.' },
    },
  },
  pt: {
    title: 'Arquitetura do Reposit\u00f3rio - vmargato.com',
    instructions: 'Passe o mouse sobre qualquer n\u00f3 para rastrear suas conex\u00f5es',
    center: 'Centralizar',
    columns: ['FONTES', 'BUILD.PY', 'SA\u00cdDA'],
    nodes: {
      'posts-en':      { desc: 'Posts em ingl\u00eas. Cada um tem frontmatter YAML (title, date, excerpt) e corpo em Markdown.' },
      'posts-pt':      { desc: 'Posts em portugu\u00eas. Pareados com os posts em ingl\u00eas pelo slug do nome de arquivo.' },
      'templates':     { desc: 'Quatro templates HTML: base.html (estrutura do site), post.html, page.html e index.html. Usados por build_post, build_page e build_index para estruturar a sa\u00edda.' },
      'pages-en':      { desc: 'P\u00e1gina sobre em ingl\u00eas. Seu conte\u00fado renderizado \u00e9 inserido na homepage pelo build_index.' },
      'pages-pt':      { desc: 'P\u00e1gina sobre em portugu\u00eas. Inserida na homepage em portugu\u00eas.' },
      'static':        { desc: 'CSS (Tufte + tema customizado), JavaScript (toggle de tema, idioma, \u00edndice), fontes hospedadas no pr\u00f3prio site (ET Book, Source Code Pro, Inter), uma c\u00f3pia local do D3.js e os embeds interativos.' },
      'build-post':    { desc: 'Para cada post: interpreta frontmatter, converte Markdown para HTML com a extens\u00e3o Tufte (sidenotes, margin notes), extrai cabe\u00e7alhos para o \u00edndice, renderiza por post.html e depois base.html.' },
      'build-index':   { desc: 'Constr\u00f3i a homepage: insere conte\u00fado da p\u00e1gina sobre, lista posts n\u00e3o-rascunho em ordem cronol\u00f3gica decrescente, renderiza por index.html e base.html.' },
      'build-feed':    { desc: 'Gera um feed Atom XML com os 20 posts mais recentes (excluindo rascunhos). Usado por leitores RSS.' },
      'copy-static':   { desc: 'Copia o diret\u00f3rio static/ inteiro para output/static/ sem nenhuma modifica\u00e7\u00e3o.' },
      'root-redirect': { desc: 'Grava o index.html da raiz: a homepage em portugu\u00eas, com um pequeno script no head que manda o visitante para en/ se ele j\u00e1 escolheu ingl\u00eas antes (localStorage) ou se o idioma do navegador come\u00e7a com en.' },
      'out-posts-en':  { desc: 'Posts renderizados em ingl\u00eas. Cada um com sidenotes Tufte, sidebar de \u00edndice opcional e toggle de idioma para a vers\u00e3o em portugu\u00eas.' },
      'out-posts-pt':  { desc: 'Posts renderizados em portugu\u00eas. Mesma estrutura, com toggle de idioma para a vers\u00e3o em ingl\u00eas.' },
      'out-index-en':  { desc: 'Homepage em ingl\u00eas. Se\u00e7\u00e3o sobre no topo, seguida da listagem de posts do mais recente ao mais antigo.' },
      'out-index-pt':  { desc: 'Homepage em portugu\u00eas. Mesmo layout com conte\u00fado traduzido.' },
      'out-feed-en':   { desc: 'Feed Atom para posts em ingl\u00eas. At\u00e9 20 entradas mais recentes.' },
      'out-feed-pt':   { desc: 'Feed Atom para posts em portugu\u00eas.' },
      'out-static':    { desc: 'CSS, JavaScript, fontes e embeds copiados sem altera\u00e7\u00e3o do diret\u00f3rio static/ original.' },
      'out-root':      { desc: 'P\u00e1gina raiz. Mostra a homepage em portugu\u00eas direto; quem l\u00ea em ingl\u00eas \u00e9 redirecionado para en/.' },
    },
  },
};

const T = STRINGS[LANG];
document.title = T.title;
document.getElementById('instructions').textContent = T.instructions;
document.getElementById('center-btn').textContent = T.center;
nodes.forEach(n => Object.assign(n, T.nodes[n.id]));

const nodeMap = {};
nodes.forEach(n => nodeMap[n.id] = n);

const edges = [
  // Posts → build_post
  { source: 'posts-en', target: 'build-post', type: 'horizontal' },
  { source: 'posts-pt', target: 'build-post', type: 'horizontal' },

  // Templates → build functions
  { source: 'templates', target: 'build-post',  type: 'horizontal' },
  { source: 'templates', target: 'build-index', type: 'horizontal' },

  // Pages → build_index
  { source: 'pages-en', target: 'build-index', type: 'horizontal' },
  { source: 'pages-pt', target: 'build-index', type: 'horizontal' },

  // Static → copy
  { source: 'static', target: 'copy-static', type: 'copy' },

  // Internal data flow (post metadata feeds index and feed)
  { source: 'build-post', target: 'build-index', type: 'data' },
  { source: 'build-post', target: 'build-feed',  type: 'branch' },

  // Function → output
  { source: 'build-post',    target: 'out-posts-en', type: 'horizontal' },
  { source: 'build-post',    target: 'out-posts-pt', type: 'horizontal' },
  { source: 'build-index',   target: 'out-index-en', type: 'horizontal' },
  { source: 'build-index',   target: 'out-index-pt', type: 'horizontal' },
  { source: 'build-feed',    target: 'out-feed-en',  type: 'horizontal' },
  { source: 'build-feed',    target: 'out-feed-pt',  type: 'horizontal' },
  { source: 'copy-static',   target: 'out-static',   type: 'copy' },
  { source: 'root-redirect', target: 'out-root',     type: 'horizontal' },
];

// Compute SVG paths for edges
edges.forEach(e => {
  const s = nodeMap[e.source], t = nodeMap[e.target];
  if (e.type === 'vertical' || e.type === 'data') {
    e.path = `M ${s.x},${s.y + NH/2} L ${t.x},${t.y - NH/2}`;
  } else if (e.type === 'branch') {
    // Curve right to avoid nodes between source and target
    const sx = s.x, sy = s.y + NH/2;
    const tx = t.x, ty = t.y - NH/2;
    e.path = `M ${sx},${sy} C ${sx + 70},${sy + 40} ${tx + 70},${ty - 40} ${tx},${ty}`;
  } else {
    // horizontal and copy: bezier from right edge of source to left edge of target
    const sx = s.x + NW/2, sy = s.y;
    const tx = t.x - NW/2, ty = t.y;
    e.path = d3.linkHorizontal()({ source: [sx, sy], target: [tx, ty] });
  }
});

// --- SVG setup ---
const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select("body").append("svg")
  .attr("width", width)
  .attr("height", height)
  .attr("viewBox", "0 0 960 610")
  .attr("preserveAspectRatio", "xMidYMid meet");

const g = svg.append("g");

const zoom = d3.zoom()
  .scaleExtent([0.5, 3])
  .on("zoom", (event) => g.attr("transform", event.transform));
svg.call(zoom);

// --- Column headers ---
const headers = [
  { label: T.columns[0], x: 120, y: 35 },
  { label: T.columns[1], x: 460, y: 35 },
  { label: T.columns[2], x: 800, y: 35 },
];

g.selectAll(".col-header")
  .data(headers)
  .join("text")
  .attr("class", "col-header")
  .attr("x", d => d.x)
  .attr("y", d => d.y)
  .text(d => d.label);

// --- Edges ---
const edgeGroup = g.append("g");

const edgePaths = edgeGroup.selectAll("path")
  .data(edges)
  .join("path")
  .attr("class", d => "edge" + (d.type === "copy" ? " copy" : "") + (d.type === "data" || d.type === "branch" ? " data" : ""))
  .attr("d", d => d.path);

// --- Nodes ---
const nodeGroup = g.append("g");

const nodeGs = nodeGroup.selectAll("g")
  .data(nodes)
  .join("g")
  .attr("class", d => "node " + d.type)
  .attr("data-id", d => d.id)
  .attr("transform", d => `translate(${d.x - NW/2}, ${d.y - NH/2})`);

nodeGs.append("rect")
  .attr("width", NW)
  .attr("height", NH)
  .attr("rx", NR);

nodeGs.append("text")
  .attr("class", d => d.type === 'process' ? 'label' : 'filepath')
  .attr("x", NW / 2)
  .attr("y", NH / 2 + 4)
  .attr("text-anchor", "middle")
  .text(d => d.label);

// --- Interactions ---
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function getConnected(nodeId) {
  const connected = new Set();
  edges.forEach(e => {
    if (e.source === nodeId) connected.add(e.target);
    if (e.target === nodeId) connected.add(e.source);
  });
  return connected;
}

const tooltip = d3.select("#tooltip");

nodeGs.on("mouseover", function(event, d) {
  const connected = getConnected(d.id);

  edgePaths
    .attr("stroke-opacity", e =>
      (e.source === d.id || e.target === d.id) ? 1 : 0.12)
    .attr("stroke-width", e =>
      (e.source === d.id || e.target === d.id) ? 2.5 : 1.5)
    .attr("stroke", e =>
      (e.source === d.id || e.target === d.id) ? cssVar('--link-hover') : cssVar('--link-color'));

  nodeGs.select("rect").attr("opacity", n =>
    n.id === d.id || connected.has(n.id) ? 1 : 0.15);
  nodeGs.selectAll("text").attr("opacity", n =>
    n.id === d.id || connected.has(n.id) ? 1 : 0.15);

  tooltip
    .html(`<b>${d.label}</b><br><span class="desc">${d.desc}</span>`)
    .style("opacity", 1);
  positionTooltip(event);
})
.on("mousemove", positionTooltip)
.on("mouseout", function() {
  edgePaths
    .attr("stroke-opacity", 1)
    .attr("stroke-width", 1.5)
    .attr("stroke", cssVar('--link-color'));
  nodeGs.select("rect").attr("opacity", 1);
  nodeGs.selectAll("text").attr("opacity", 1);
  tooltip.style("opacity", 0);
});

function positionTooltip(event) {
  let x = event.pageX + 14;
  let y = event.pageY - 14;
  const tt = tooltip.node();
  const ttW = tt.offsetWidth, ttH = tt.offsetHeight;
  if (x + ttW > width - 8) x = event.pageX - ttW - 14;
  if (y + ttH > height - 8) y = height - ttH - 8;
  if (y < 8) y = 8;
  tooltip.style("left", x + "px").style("top", y + "px");
}

// --- Center / fit ---
function centerGraph() {
  const pad = 40;
  const minX = d3.min(nodes, n => n.x - NW/2) - pad;
  const maxX = d3.max(nodes, n => n.x + NW/2) + pad;
  const minY = d3.min(nodes, n => n.y - NH/2) - pad - 20;
  const maxY = d3.max(nodes, n => n.y + NH/2) + pad;
  const gw = maxX - minX, gh = maxY - minY;
  const midX = (minX + maxX) / 2, midY = (minY + maxY) / 2;

  const vw = 960, vh = 610;
  const scale = Math.min(vw / gw, vh / gh, 1.2) * 0.9;
  const tx = vw / 2 - midX * scale;
  const ty = vh / 2 - midY * scale;

  svg.transition().duration(600).call(
    zoom.transform,
    d3.zoomIdentity.translate(tx, ty).scale(scale)
  );
}

centerGraph();
</script>
</body>
</html>
