<article>
    <h1>Vitor Margato</h1>
    <section class="about">
        {{about_html}}
    </section>
    <p class="dinkus">* * *</p>
    <section>
        <ul class="post-list">
            {{#posts}}
            <li class="post-item">
                <h2 class="post-title"><a href="{{url}}">{{title}}</a></h2>
                <span class="post-meta">
                    <time class="post-date" datetime="{{published_date}}">{{published_date_formatted}}</time>
                </span>
                {{#excerpt}}<p class="post-excerpt">{{excerpt}}</p>{{/excerpt}}
            </li>
            {{/posts}}
        </ul>
    </section>
</article>
